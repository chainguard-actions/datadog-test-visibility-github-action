name: Test tracer version inputs (java, ruby, go) and java-instrumented-build-system
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: java
          api_key: dummy-api-key-for-testing
          site: datadoghq.com
          java-tracer-version: "1.36.0"
          java-instrumented-build-system: gradle
          ruby-tracer-version: "1.0.0"
          go-tracer-version: "0.14.0"
          print-github-step-summary: "false"
      - name: Assert action ran (inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with java-tracer-version, java-instrumented-build-system, ruby-tracer-version, and go-tracer-version inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
