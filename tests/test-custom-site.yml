name: Test custom site input propagation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          languages: js
          api_key: fake-api-key-for-testing
          site: datadoghq.eu

      - name: Assert DD_SITE is set to datadoghq.eu
        run: |
          echo "DD_SITE: $DD_SITE"
          if [ "$DD_SITE" != "datadoghq.eu" ]; then
            echo "FAIL: expected 'datadoghq.eu', got '$DD_SITE'"
            exit 1
          fi
          echo "PASS"

      - name: Assert DD_API_KEY is set
        run: |
          echo "DD_API_KEY: $DD_API_KEY"
          if [ -z "$DD_API_KEY" ]; then
            echo "FAIL: DD_API_KEY is not set"
            exit 1
          fi
          echo "PASS"
