name: Test custom site propagation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock curl and sha256sum
        run: |
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl.sh" "$HOME/.local/bin/curl"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-sha256sum.sh" "$HOME/.local/bin/sha256sum"
          chmod +x "$HOME/.local/bin/curl" "$HOME/.local/bin/sha256sum"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          languages: python
          api_key: test-api-key-12345
          site: datadoghq.eu

      - name: Assert DD_SITE is set to custom EU site
        run: |
          echo "site: $DD_SITE"
          if [ "$DD_SITE" != "datadoghq.eu" ]; then
            echo "FAIL: expected DD_SITE=datadoghq.eu, got '$DD_SITE'"
            exit 1
          fi
          echo "PASS"

      - name: Assert DD_API_KEY is set
        run: |
          echo "api_key set: $([ -n "$DD_API_KEY" ] && echo yes || echo no)"
          if [ -z "$DD_API_KEY" ]; then
            echo "FAIL: DD_API_KEY is not set"
            exit 1
          fi
          echo "PASS"
