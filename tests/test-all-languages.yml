name: Test all languages instrumentation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: all
          api_key: fake-api-key-for-testing
          site: datadoghq.com
          service: my-all-languages-service
          cache: 'false'

      - name: Assert action ran with all languages
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "DD_API_KEY: $DD_API_KEY"
          echo "DD_SITE: $DD_SITE"
          echo "DD_SERVICE: $DD_SERVICE"
          echo "DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER: $DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DD_API_KEY" ]; then
              echo "FAIL: DD_API_KEY should be set"
              exit 1
            fi
            if [ "$DD_SITE" != "datadoghq.com" ]; then
              echo "FAIL: DD_SITE should be datadoghq.com, got: $DD_SITE"
              exit 1
            fi
            if [ "$DD_SERVICE" != "my-all-languages-service" ]; then
              echo "FAIL: DD_SERVICE should be my-all-languages-service, got: $DD_SERVICE"
              exit 1
            fi
            if [ "$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER" != "github" ]; then
              echo "FAIL: DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER should be github"
              exit 1
            fi
            echo "PASS: action succeeded with all languages"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness with fake API key or network issues)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
