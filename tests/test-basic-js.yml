name: Test basic JS language instrumentation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake curl that serves a minimal install script and honors -o flag
      - name: Set up mock curl and sha256sum
        run: |
          # Create a minimal fake install script that outputs env vars to GITHUB_ENV
          cat > /tmp/fake-install.sh << 'FAKESCRIPT'
          #!/bin/sh
          # Fake install script: outputs tracer version env vars
          echo "DD_TRACER_VERSION_JS=5.0.0"
          FAKESCRIPT
          chmod +x /tmp/fake-install.sh

          # Create fake curl that serves the fake install script
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/curl << 'FAKECURL'
          #!/bin/sh
          # Fake curl: honor -o/--output flag
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output|-Lo) out="$arg" ;;
            esac
            prev="$arg"
          done
          # Also handle -Lo as a combined flag
          for arg in "$@"; do
            case "$arg" in
              -Lo)
                # next arg is the output file - handled above
                ;;
            esac
          done
          if [ -n "$out" ]; then
            cat /tmp/fake-install.sh > "$out"
          else
            cat /tmp/fake-install.sh
          fi
          exit 0
          FAKECURL
          chmod +x /tmp/fake-bin/curl

          # Create fake sha256sum that always succeeds
          cat > /tmp/fake-bin/sha256sum << 'FAKECHECKSUM'
          #!/bin/sh
          # If called with -c, always succeed
          if echo "$@" | grep -q -- '-c'; then
            echo "install_test_visibility.sh: OK"
            exit 0
          fi
          # Otherwise compute real checksum
          exec /usr/bin/sha256sum "$@"
          FAKECHECKSUM
          chmod +x /tmp/fake-bin/sha256sum

          echo "/tmp/fake-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          languages: js
          api_key: test-api-key-12345
          site: datadoghq.com
          service: my-test-service

      - name: Assert DD_API_KEY is set
        run: |
          echo "actual DD_API_KEY: $DD_API_KEY"
          if [ -z "$DD_API_KEY" ]; then
            echo "FAIL: DD_API_KEY is not set"
            exit 1
          fi
          echo "PASS: DD_API_KEY is set"

      - name: Assert DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER is set
        run: |
          echo "actual: $DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER"
          if [ "$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER" != "github" ]; then
            echo "FAIL: expected 'github', got '$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER'"
            exit 1
          fi
          echo "PASS"

      - name: Assert DD_SITE is set
        run: |
          echo "actual DD_SITE: $DD_SITE"
          if [ "$DD_SITE" != "datadoghq.com" ]; then
            echo "FAIL: expected 'datadoghq.com', got '$DD_SITE'"
            exit 1
          fi
          echo "PASS"

      - name: Assert DD_SERVICE is set
        run: |
          echo "actual DD_SERVICE: $DD_SERVICE"
          if [ "$DD_SERVICE" != "my-test-service" ]; then
            echo "FAIL: expected 'my-test-service', got '$DD_SERVICE'"
            exit 1
          fi
          echo "PASS"
