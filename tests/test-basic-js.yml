name: Test basic JS language setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: js
          api_key: fake-api-key-for-testing
          site: datadoghq.com

      - name: Assert action ran (env vars set or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DD_API_KEY_VAL: ${{ env.DD_API_KEY }}
          DD_PROVIDER: ${{ env.DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER }}
        run: |
          echo "outcome: $OUTCOME"
          echo "DD_API_KEY set: $DD_API_KEY_VAL"
          echo "DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER: $DD_PROVIDER"

          if [ "$OUTCOME" = "success" ]; then
            # If the action succeeded, verify key env vars were set
            if [ -z "$DD_API_KEY_VAL" ]; then
              echo "FAIL: DD_API_KEY should be set"
              exit 1
            fi
            if [ "$DD_PROVIDER" != "github" ]; then
              echo "FAIL: DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER should be 'github', got '$DD_PROVIDER'"
              exit 1
            fi
            echo "PASS: action succeeded and env vars are set correctly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake API key / network restrictions)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
