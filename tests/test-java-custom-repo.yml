name: Test Java instrumentation with custom repository options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          languages: java
          api_key: test-api-key-12345
          site: datadoghq.com
          service: java-test-service
          java-instrumented-build-system: gradle
          java-tracer-repository-url: https://repo1.maven.org/maven2
          java-tracer-repository-auth-header: "X-Custom-Header: test-value"
          java-tracer-auth-disable-redirects: "true"

      - name: Assert DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER is set
        run: |
          echo "DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER: $DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER"
          if [ "$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER" != "github" ]; then
            echo "FAIL: expected DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER=github, got '$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER'"
            exit 1
          fi
          echo "PASS"

      - name: Assert DD_API_KEY is set
        run: |
          echo "DD_API_KEY is set: $([ -n "$DD_API_KEY" ] && echo yes || echo no)"
          if [ -z "$DD_API_KEY" ]; then
            echo "FAIL: DD_API_KEY should be set"
            exit 1
          fi
          echo "PASS"

      - name: Assert DD_SERVICE is set
        run: |
          echo "DD_SERVICE: $DD_SERVICE"
          if [ "$DD_SERVICE" != "java-test-service" ]; then
            echo "FAIL: expected DD_SERVICE=java-test-service, got '$DD_SERVICE'"
            exit 1
          fi
          echo "PASS"
