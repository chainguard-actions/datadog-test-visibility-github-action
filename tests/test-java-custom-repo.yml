name: Test Java custom repository and build system inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: java
          api_key: test-api-key-12345
          java-instrumented-build-system: gradle
          java-tracer-repository-url: https://repo1.maven.org/maven2
          java-tracer-repository-auth-header: "X-API-Key: test-header-value"
          java-tracer-auth-disable-redirects: "true"

      - name: Assert action ran (inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom Java repository inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with custom/test repo settings)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert DD_API_KEY is set
        run: |
          echo "actual DD_API_KEY: $DD_API_KEY"
          if [ "$DD_API_KEY" != "test-api-key-12345" ]; then
            echo "FAIL: expected DD_API_KEY='test-api-key-12345', got '$DD_API_KEY'"
            exit 1
          fi
          echo "PASS: DD_API_KEY is set correctly"

      - name: Assert DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER is set
        run: |
          echo "actual DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER: $DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER"
          if [ "$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER" != "github" ]; then
            echo "FAIL: expected DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER='github', got '$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER'"
            exit 1
          fi
          echo "PASS: DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER is set correctly"
