name: Test basic usage with api_key and service
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          languages: js
          api_key: fake-api-key-for-testing
          site: datadoghq.com
          service: my-test-service
          print-github-step-summary: "false"

      - name: Assert DD_API_KEY is set
        run: |
          echo "DD_API_KEY: $DD_API_KEY"
          if [ -z "$DD_API_KEY" ]; then
            echo "FAIL: DD_API_KEY should be set"
            exit 1
          fi
          echo "PASS"

      - name: Assert DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER is set
        run: |
          echo "DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER: $DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER"
          if [ "$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER" != "github" ]; then
            echo "FAIL: expected 'github', got '$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER'"
            exit 1
          fi
          echo "PASS"

      - name: Assert DD_SITE is set
        run: |
          echo "DD_SITE: $DD_SITE"
          if [ "$DD_SITE" != "datadoghq.com" ]; then
            echo "FAIL: expected 'datadoghq.com', got '$DD_SITE'"
            exit 1
          fi
          echo "PASS"

      - name: Assert DD_SERVICE is set
        run: |
          echo "DD_SERVICE: $DD_SERVICE"
          if [ "$DD_SERVICE" != "my-test-service" ]; then
            echo "FAIL: expected 'my-test-service', got '$DD_SERVICE'"
            exit 1
          fi
          echo "PASS"
