name: Test basic usage with api_key and service
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          languages: js
          api_key: fake-api-key-for-testing
          site: datadoghq.com
          service: my-test-service
        continue-on-error: true
      - name: Assert DD_API_KEY env var is set
        run: |
          echo "DD_API_KEY: $DD_API_KEY"
          if [ -z "$DD_API_KEY" ]; then
            echo "FAIL: DD_API_KEY should be set"
            exit 1
          fi
          echo "PASS: DD_API_KEY is set"
      - name: Assert DD_SITE env var is set
        run: |
          echo "DD_SITE: $DD_SITE"
          if [ "$DD_SITE" != "datadoghq.com" ]; then
            echo "FAIL: expected DD_SITE=datadoghq.com, got $DD_SITE"
            exit 1
          fi
          echo "PASS: DD_SITE is correct"
      - name: Assert DD_SERVICE env var is set
        run: |
          echo "DD_SERVICE: $DD_SERVICE"
          if [ "$DD_SERVICE" != "my-test-service" ]; then
            echo "FAIL: expected DD_SERVICE=my-test-service, got $DD_SERVICE"
            exit 1
          fi
          echo "PASS: DD_SERVICE is correct"
      - name: Assert DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER is set
        run: |
          echo "DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER: $DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER"
          if [ "$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER" != "github" ]; then
            echo "FAIL: expected DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER=github"
            exit 1
          fi
          echo "PASS"
