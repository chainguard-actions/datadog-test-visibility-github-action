name: Test no service input - DD_SERVICE should not be set
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake curl that serves a minimal install script and honors -o flag
      - name: Set up mock curl and sha256sum
        run: |
          # Create a minimal fake install script
          cat > /tmp/fake-install.sh << 'FAKESCRIPT'
          #!/bin/sh
          echo "DD_TRACER_VERSION_JAVA=1.30.0"
          FAKESCRIPT
          chmod +x /tmp/fake-install.sh

          mkdir -p /tmp/fake-bin

          # Fake curl that honors -Lo and -o flags
          cat > /tmp/fake-bin/curl << 'FAKECURL'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            case "$arg" in
              -Lo)
                prev="-o"
                continue
                ;;
            esac
            prev="$arg"
          done
          if [ -n "$out" ]; then
            cat /tmp/fake-install.sh > "$out"
          else
            cat /tmp/fake-install.sh
          fi
          exit 0
          FAKECURL
          chmod +x /tmp/fake-bin/curl

          # Fake sha256sum that always passes checksum verification
          cat > /tmp/fake-bin/sha256sum << 'FAKECHECKSUM'
          #!/bin/sh
          if echo "$*" | grep -q -- '-c'; then
            echo "install_test_visibility.sh: OK"
            exit 0
          fi
          exec /usr/bin/sha256sum "$@"
          FAKECHECKSUM
          chmod +x /tmp/fake-bin/sha256sum

          echo "/tmp/fake-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          languages: java
          api_key: test-api-key-java
          # No service input provided - DD_SERVICE should not be set

      - name: Assert DD_SERVICE is not set when no service input given
        run: |
          echo "actual DD_SERVICE: '$DD_SERVICE'"
          if [ -n "$DD_SERVICE" ]; then
            echo "FAIL: DD_SERVICE should not be set, but got '$DD_SERVICE'"
            exit 1
          fi
          echo "PASS: DD_SERVICE is not set as expected"

      - name: Assert DD_SITE defaults to datadoghq.com
        run: |
          echo "actual DD_SITE: $DD_SITE"
          if [ "$DD_SITE" != "datadoghq.com" ]; then
            echo "FAIL: expected default 'datadoghq.com', got '$DD_SITE'"
            exit 1
          fi
          echo "PASS"

      - name: Assert DD_API_KEY is set
        run: |
          echo "actual DD_API_KEY: $DD_API_KEY"
          if [ -z "$DD_API_KEY" ]; then
            echo "FAIL: DD_API_KEY is not set"
            exit 1
          fi
          echo "PASS"

      - name: Assert provider is github
        run: |
          echo "actual: $DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER"
          if [ "$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER" != "github" ]; then
            echo "FAIL: expected 'github'"
            exit 1
          fi
          echo "PASS"
