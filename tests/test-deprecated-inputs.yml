name: Test deprecated api-key and service-name inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock curl and sha256sum
        run: |
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl.sh" "$HOME/.local/bin/curl"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-sha256sum.sh" "$HOME/.local/bin/sha256sum"
          chmod +x "$HOME/.local/bin/curl" "$HOME/.local/bin/sha256sum"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          languages: js
          api-key: test-api-key-hyphen-alias
          service-name: my-deprecated-service

      - name: Assert DD_API_KEY is set via deprecated api-key input
        run: |
          echo "api_key set: $([ -n "$DD_API_KEY" ] && echo yes || echo no)"
          if [ -z "$DD_API_KEY" ]; then
            echo "FAIL: DD_API_KEY is not set when using deprecated api-key input"
            exit 1
          fi
          echo "PASS: DD_API_KEY is set"

      - name: Assert DD_SERVICE is set via deprecated service-name input
        run: |
          echo "service: $DD_SERVICE"
          if [ "$DD_SERVICE" != "my-deprecated-service" ]; then
            echo "FAIL: expected DD_SERVICE=my-deprecated-service, got '$DD_SERVICE'"
            exit 1
          fi
          echo "PASS: DD_SERVICE is set correctly via service-name"

      - name: Assert DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER is set
        run: |
          echo "provider: $DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER"
          if [ "$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER" != "github" ]; then
            echo "FAIL: expected provider=github, got '$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER'"
            exit 1
          fi
          echo "PASS"
