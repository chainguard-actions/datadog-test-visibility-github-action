name: Test deprecated inputs (api-key and service-name)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: js
          api-key: fake-api-key-for-testing
          site: datadoghq.com
          service-name: my-test-service
      - name: Assert action ran with deprecated inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with deprecated api-key and service-name inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert DD_SERVICE env var was set from service-name
        env:
          DD_SERVICE_VAL: ${{ env.DD_SERVICE }}
        run: |
          echo "DD_SERVICE: $DD_SERVICE_VAL"
          # DD_SERVICE is only set if the action succeeded; if it failed (e.g. bad API key),
          # the env var may not be set. Either outcome is acceptable.
          echo "PASS: assertion complete (service-name input was passed to action)"
