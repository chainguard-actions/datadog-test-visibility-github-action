name: Test deprecated api-key and service-name inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          languages: js
          api-key: test-api-key-12345678901234567890123456789012
          service-name: my-deprecated-service

      - name: Assert DD_API_KEY is set via deprecated api-key input
        run: |
          echo "DD_API_KEY: $DD_API_KEY"
          if [ -z "$DD_API_KEY" ]; then
            echo "FAIL: DD_API_KEY is not set"
            exit 1
          fi
          echo "PASS: DD_API_KEY is set"

      - name: Assert DD_SERVICE is set via deprecated service-name input
        run: |
          echo "DD_SERVICE: $DD_SERVICE"
          if [ "$DD_SERVICE" != "my-deprecated-service" ]; then
            echo "FAIL: expected 'my-deprecated-service', got '$DD_SERVICE'"
            exit 1
          fi
          echo "PASS: DD_SERVICE is set correctly via service-name"

      - name: Assert DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER is set to github
        run: |
          echo "DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER: $DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER"
          if [ "$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER" != "github" ]; then
            echo "FAIL: expected 'github', got '$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER'"
            exit 1
          fi
          echo "PASS"
