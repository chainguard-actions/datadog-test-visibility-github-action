name: Test deprecated inputs (api-key and service-name)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          languages: python
          api-key: fake-api-key-deprecated
          service-name: my-deprecated-service
          print-github-step-summary: "false"
        continue-on-error: true
      - name: Assert action accepted deprecated inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action accepted deprecated api-key and service-name inputs"
