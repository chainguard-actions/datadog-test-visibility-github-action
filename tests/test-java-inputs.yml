name: Test Java tracer inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          languages: java
          api_key: fake-api-key-for-testing
          java-tracer-version: "1.30.0"
          java-instrumented-build-system: gradle
          java-tracer-repository-url: https://repo1.maven.org/maven2
          java-tracer-repository-auth-header: "Authorization: Bearer fake-token"
          java-tracer-auth-disable-redirects: "true"
          print-github-step-summary: "false"
        continue-on-error: true
      - name: Assert action accepted Java inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action accepted Java-specific inputs"
