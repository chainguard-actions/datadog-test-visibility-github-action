name: Test Java tracer inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: java
          api_key: fake-api-key-for-testing
          site: datadoghq.com
          java-tracer-version: "1.30.0"
          java-instrumented-build-system: gradle
          java-tracer-repository-url: https://repo1.maven.org/maven2
          java-tracer-repository-auth-header: "Authorization: Bearer test-token"
          java-tracer-auth-disable-redirects: "true"
      - name: Assert action ran with Java inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with Java inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
