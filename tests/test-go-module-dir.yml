name: Test go-module-dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: go
          api_key: fake-dd-api-key-for-testing
          go-module-dir: ./mymodule
      - name: Assert action ran with go-module-dir input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action accepts go-module-dir and passes it as DD_CIVISIBILITY_GO_MODULE_DIR
          # to the installation script. The script may fail in the test environment
          # but the action must accept the input without crashing early.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with go-module-dir input accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
