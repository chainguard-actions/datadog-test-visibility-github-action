name: Test Go instrumentation with custom module directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.21'

      - name: Create a Go module subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/myapp"
          cat > "$GITHUB_WORKSPACE/myapp/go.mod" <<'EOF'
          module example.com/myapp

          go 1.21
          EOF

      - id: action
        uses: .
        with:
          languages: go
          api_key: test-api-key-12345
          site: datadoghq.com
          service: go-test-service
          go-module-dir: myapp
          cache: "false"

      - name: Assert DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER is set
        run: |
          echo "DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER: $DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER"
          if [ "$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER" != "github" ]; then
            echo "FAIL: expected DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER=github, got '$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER'"
            exit 1
          fi
          echo "PASS"

      - name: Assert DD_API_KEY is set
        run: |
          echo "DD_API_KEY is set: $([ -n "$DD_API_KEY" ] && echo yes || echo no)"
          if [ -z "$DD_API_KEY" ]; then
            echo "FAIL: DD_API_KEY should be set"
            exit 1
          fi
          echo "PASS"

      - name: Assert DD_SERVICE is set
        run: |
          echo "DD_SERVICE: $DD_SERVICE"
          if [ "$DD_SERVICE" != "go-test-service" ]; then
            echo "FAIL: expected DD_SERVICE=go-test-service, got '$DD_SERVICE'"
            exit 1
          fi
          echo "PASS"
