name: Test go and java specific inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: java go
          api_key: fake-dd-api-key-for-testing
          site: datadoghq.com
          go-tracer-version: "0.56.0"
          go-module-dir: "."
          java-tracer-version: "1.0.0"
          java-instrumented-build-system: gradle
          cache: "false"
          print-github-step-summary: "false"
      - name: Assert action ran (go and java inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with go and java specific inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
