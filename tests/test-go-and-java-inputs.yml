name: Test go and java specific inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: go java
          api_key: fake-dd-api-key-for-testing
          site: datadoghq.com
          go-tracer-version: "0.5.0"
          go-module-dir: "."
          java-tracer-version: "1.30.0"
          java-instrumented-build-system: gradle
          cache: "false"
      - name: Assert action ran (go and java specific inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with go and java specific inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - script download or checksum may fail in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
