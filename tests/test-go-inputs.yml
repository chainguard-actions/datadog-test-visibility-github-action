name: Test Go tracer inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: go
          api_key: fake-api-key-for-testing
          go-tracer-version: latest
          go-module-dir: "."
          print-github-step-summary: "false"
          cache: "false"
      - name: Assert action ran (may fail due to network/API key)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed with go inputs"
