name: Test service name propagation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          languages: js
          api_key: fake-api-key-for-testing
          service: my-test-service

      - name: Assert DD_SERVICE is set to my-test-service
        run: |
          echo "actual DD_SERVICE: $DD_SERVICE"
          if [ "$DD_SERVICE" != "my-test-service" ]; then
            echo "FAIL: expected 'my-test-service', got '$DD_SERVICE'"
            exit 1
          fi
          echo "PASS"
