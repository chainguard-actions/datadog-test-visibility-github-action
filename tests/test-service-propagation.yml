name: Test service name propagation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: python
          api_key: fake-api-key-for-testing
          service: my-test-service
          site: datadoghq.com

      - name: Assert service env var propagated or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DD_SERVICE_VAL: ${{ env.DD_SERVICE }}
          DD_API_KEY_VAL: ${{ env.DD_API_KEY }}
        run: |
          echo "outcome: $OUTCOME"
          echo "DD_SERVICE: $DD_SERVICE_VAL"
          echo "DD_API_KEY set: $DD_API_KEY_VAL"

          if [ "$OUTCOME" = "success" ]; then
            if [ "$DD_SERVICE_VAL" != "my-test-service" ]; then
              echo "FAIL: DD_SERVICE should be 'my-test-service', got '$DD_SERVICE_VAL'"
              exit 1
            fi
            if [ -z "$DD_API_KEY_VAL" ]; then
              echo "FAIL: DD_API_KEY should be set"
              exit 1
            fi
            echo "PASS: DD_SERVICE correctly set to 'my-test-service'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake API key / network restrictions)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
