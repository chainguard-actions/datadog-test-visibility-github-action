name: Test Java custom repository URL and build system
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          languages: java
          api_key: dummy-api-key-for-tests
          java-tracer-repository-url: https://repo1.maven.org/maven2
          java-instrumented-build-system: gradle
      - name: Assert Java tracer installed from custom repository
        run: |
          echo "DD_TRACER_VERSION_JAVA=$DD_TRACER_VERSION_JAVA"
          echo "DD_API_KEY=$DD_API_KEY"
          echo "DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER=$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER"
          if [ -z "$DD_TRACER_VERSION_JAVA" ]; then
            echo "FAIL: DD_TRACER_VERSION_JAVA is empty"; exit 1
          fi
          if [ "$DD_API_KEY" != "dummy-api-key-for-tests" ]; then
            echo "FAIL: DD_API_KEY not propagated"; exit 1
          fi
          if [ "$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER" != "github" ]; then
            echo "FAIL: provider not set to github"; exit 1
          fi
          if [ ! -d "$GITHUB_WORKSPACE/.datadog" ]; then
            echo "FAIL: .datadog tracer folder not created"; exit 1
          fi
          echo "PASS"
