name: Test dotnet and ruby tracer inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: dotnet ruby
          api_key: fake-api-key-for-testing
          dotnet-tracer-version: latest
          ruby-tracer-version: latest
          print-github-step-summary: "false"
          cache: "false"
      - name: Assert action ran (may fail due to network/API key)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed with dotnet and ruby inputs"
