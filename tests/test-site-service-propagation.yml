name: Test site and service input propagation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: python
          api_key: fake-api-key-for-testing
          site: datadoghq.eu
          service: my-python-service

      - name: Assert site and service env vars are propagated
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "DD_SITE: $DD_SITE"
          echo "DD_SERVICE: $DD_SERVICE"
          echo "DD_API_KEY: $DD_API_KEY"
          echo "DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER: $DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER"

          if [ "$OUTCOME" = "success" ]; then
            # Verify site is set to the custom EU site
            if [ "$DD_SITE" != "datadoghq.eu" ]; then
              echo "FAIL: DD_SITE should be datadoghq.eu, got: $DD_SITE"
              exit 1
            fi
            # Verify service is set
            if [ "$DD_SERVICE" != "my-python-service" ]; then
              echo "FAIL: DD_SERVICE should be my-python-service, got: $DD_SERVICE"
              exit 1
            fi
            # Verify provider is set
            if [ "$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER" != "github" ]; then
              echo "FAIL: DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER should be github"
              exit 1
            fi
            echo "PASS: site and service env vars are set correctly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness with fake API key or network issues)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
