name: Test java-instrumented-build-system input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: java
          api_key: fake-api-key-for-input-coverage
          java-instrumented-build-system: gradle
          cache: 'false'
      - name: Assert action ran (input coverage for java-instrumented-build-system)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with java-instrumented-build-system input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
