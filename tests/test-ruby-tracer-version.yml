name: Test ruby-tracer-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: ruby
          api_key: fake-api-key-for-testing
          ruby-tracer-version: "1.10.0"
          site: datadoghq.com
          print-github-step-summary: "false"
      - name: Assert action ran with ruby-tracer-version input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with ruby-tracer-version input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with ruby-tracer-version input (failed gracefully, e.g. network/checksum issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
