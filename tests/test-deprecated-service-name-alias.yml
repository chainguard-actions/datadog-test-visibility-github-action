name: Test deprecated service-name input alias
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: ruby
          api_key: fake-api-key-for-testing
          site: datadoghq.com
          service-name: my-deprecated-service-name

      - name: Assert deprecated service-name alias is accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "DD_SERVICE: $DD_SERVICE"
          echo "DD_API_KEY: $DD_API_KEY"
          echo "DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER: $DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER"

          if [ "$OUTCOME" = "success" ]; then
            # Verify the deprecated service-name alias was accepted and DD_SERVICE is set
            if [ "$DD_SERVICE" != "my-deprecated-service-name" ]; then
              echo "FAIL: DD_SERVICE should be my-deprecated-service-name, got: $DD_SERVICE"
              exit 1
            fi
            if [ "$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER" != "github" ]; then
              echo "FAIL: DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER should be github"
              exit 1
            fi
            echo "PASS: deprecated service-name alias works correctly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness with fake API key or network issues)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
