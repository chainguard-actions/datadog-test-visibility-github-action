name: Test deprecated api-key input alias
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: java
          api-key: fake-api-key-deprecated-alias
          site: datadoghq.com

      - name: Assert deprecated api-key alias is accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "DD_API_KEY: $DD_API_KEY"
          echo "DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER: $DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER"

          if [ "$OUTCOME" = "success" ]; then
            # Verify the deprecated api-key alias was accepted and DD_API_KEY is set
            if [ -z "$DD_API_KEY" ]; then
              echo "FAIL: DD_API_KEY should be set when using deprecated api-key input"
              exit 1
            fi
            if [ "$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER" != "github" ]; then
              echo "FAIL: DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER should be github"
              exit 1
            fi
            echo "PASS: deprecated api-key alias works correctly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness with fake API key or network issues)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
