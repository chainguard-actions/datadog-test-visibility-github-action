name: Test go tracer version and java instrumented build system inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: java go
          api_key: fake-api-key-for-testing
          site: datadoghq.com
          go-tracer-version: 'v0.13.0'
          java-tracer-version: '1.40.0'
          java-instrumented-build-system: gradle
          cache: 'false'

      - name: Assert action ran with go and java build system inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "DD_API_KEY: $DD_API_KEY"
          echo "DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER: $DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DD_API_KEY" ]; then
              echo "FAIL: DD_API_KEY should be set"
              exit 1
            fi
            if [ "$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER" != "github" ]; then
              echo "FAIL: DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER should be github"
              exit 1
            fi
            echo "PASS: action succeeded with go-tracer-version and java-instrumented-build-system inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness with fake API key or network issues)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
