name: Test deprecated api-key input alias
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          languages: js
          api_key: fake-api-key-for-testing
          api-key: deprecated-api-key-value
        continue-on-error: true

      - name: Assert DD_API_KEY is set (deprecated api-key input takes precedence)
        run: |
          echo "DD_API_KEY: $DD_API_KEY"
          if [ -z "$DD_API_KEY" ]; then
            echo "FAIL: DD_API_KEY should be set"
            exit 1
          fi
          # The action uses: inputs.api-key != '' && inputs.api-key || inputs.api_key
          # So when api-key is provided, it should be used
          if [ "$DD_API_KEY" != "deprecated-api-key-value" ]; then
            echo "FAIL: expected 'deprecated-api-key-value', got '$DD_API_KEY'"
            exit 1
          fi
          echo "PASS"
