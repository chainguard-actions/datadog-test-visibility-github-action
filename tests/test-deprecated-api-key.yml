name: Test deprecated api-key input alias
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          languages: js
          api-key: deprecated-api-key-value
          site: datadoghq.com

      - name: Assert DD_API_KEY is set via deprecated api-key input
        run: |
          echo "DD_API_KEY is set: $([ -n "$DD_API_KEY" ] && echo yes || echo no)"
          if [ -z "$DD_API_KEY" ]; then
            echo "FAIL: DD_API_KEY should be set when using deprecated api-key input"
            exit 1
          fi
          echo "PASS"

      - name: Assert DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER is set
        run: |
          echo "DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER: $DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER"
          if [ "$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER" != "github" ]; then
            echo "FAIL: expected DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER=github"
            exit 1
          fi
          echo "PASS"
