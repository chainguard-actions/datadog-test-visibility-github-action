name: Test deprecated api-key input alias
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake curl that serves a minimal install script and honors -o flag
      - name: Set up mock curl and sha256sum
        run: |
          # Create a minimal fake install script
          cat > /tmp/fake-install.sh << 'FAKESCRIPT'
          #!/bin/sh
          echo "DD_TRACER_VERSION_JS=4.0.0"
          FAKESCRIPT
          chmod +x /tmp/fake-install.sh

          mkdir -p /tmp/fake-bin

          # Fake curl that honors -Lo and -o flags
          cat > /tmp/fake-bin/curl << 'FAKECURL'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            case "$arg" in
              -Lo)
                prev="-o"
                continue
                ;;
            esac
            prev="$arg"
          done
          if [ -n "$out" ]; then
            cat /tmp/fake-install.sh > "$out"
          else
            cat /tmp/fake-install.sh
          fi
          exit 0
          FAKECURL
          chmod +x /tmp/fake-bin/curl

          # Fake sha256sum that always passes checksum verification
          cat > /tmp/fake-bin/sha256sum << 'FAKECHECKSUM'
          #!/bin/sh
          if echo "$*" | grep -q -- '-c'; then
            echo "install_test_visibility.sh: OK"
            exit 0
          fi
          exec /usr/bin/sha256sum "$@"
          FAKECHECKSUM
          chmod +x /tmp/fake-bin/sha256sum

          echo "/tmp/fake-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          languages: js
          api-key: deprecated-api-key-value
          site: datadoghq.com

      - name: Assert DD_API_KEY is set from deprecated api-key input
        run: |
          echo "actual DD_API_KEY: $DD_API_KEY"
          if [ "$DD_API_KEY" != "deprecated-api-key-value" ]; then
            echo "FAIL: expected 'deprecated-api-key-value', got '$DD_API_KEY'"
            exit 1
          fi
          echo "PASS: deprecated api-key input works correctly"

      - name: Assert provider is github
        run: |
          echo "actual: $DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER"
          if [ "$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER" != "github" ]; then
            echo "FAIL: expected 'github'"
            exit 1
          fi
          echo "PASS"
