name: Test java-tracer-repository inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: java
          api_key: fake-api-key-for-testing
          java-tracer-repository-url: https://repo1.maven.org/maven2
          java-tracer-repository-auth-header: 'Authorization: Bearer fake-token'
          java-tracer-auth-disable-redirects: 'true'
          cache: 'false'
          print-github-step-summary: 'false'
      - name: Assert action ran with java-tracer-repository inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME) — java-tracer-repository inputs were accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
