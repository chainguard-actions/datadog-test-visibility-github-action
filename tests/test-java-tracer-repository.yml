name: Test java-tracer-repository inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: java
          api_key: fake-dd-api-key-for-testing
          java-tracer-repository-url: https://repo.example.com/maven
          java-tracer-repository-auth-header: "Authorization: Bearer fake-token"
          java-tracer-auth-disable-redirects: "true"
      - name: Assert action ran (java-tracer-repository inputs accepted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may fail because the API key is fake and the install script
          # may not succeed, but we just need to verify the inputs are accepted
          # (i.e., the action doesn't fail due to unrecognized inputs).
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action accepted java-tracer-repository inputs (outcome: ${{ steps.action.outcome }})"
          else
            echo "FAIL: unexpected outcome '${{ steps.action.outcome }}'"
            exit 1
          fi
