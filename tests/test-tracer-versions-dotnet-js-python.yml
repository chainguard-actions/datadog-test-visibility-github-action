name: Test tracer version inputs (dotnet, js, python)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: js
          api_key: dummy-api-key-for-testing
          site: datadoghq.com
          js-tracer-version: "5.0.0"
          dotnet-tracer-version: "2.49.0"
          python-tracer-version: "2.9.0"
          print-github-step-summary: "false"
      - name: Assert action ran (inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with dotnet-tracer-version, js-tracer-version, and python-tracer-version inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
