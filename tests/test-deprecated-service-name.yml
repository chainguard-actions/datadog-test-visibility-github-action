name: Test deprecated service-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: js
          api_key: fake-dd-api-key-for-testing
          service-name: my-deprecated-service
      - name: Assert service-name was propagated to DD_SERVICE
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DD_SERVICE_VAL: ${{ env.DD_SERVICE }}
        run: |
          echo "outcome: $OUTCOME"
          echo "DD_SERVICE: $DD_SERVICE_VAL"
          # The action sets DD_SERVICE from service-name input.
          # If the action succeeded, DD_SERVICE must be set.
          # If it failed (e.g. network/checksum issue), we still check the env was attempted.
          if [ "$OUTCOME" = "success" ]; then
            if [ "$DD_SERVICE_VAL" != "my-deprecated-service" ]; then
              echo "FAIL: expected DD_SERVICE=my-deprecated-service, got '$DD_SERVICE_VAL'"
              exit 1
            fi
            echo "PASS: DD_SERVICE correctly set from service-name"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may have failed due to network/checksum in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
