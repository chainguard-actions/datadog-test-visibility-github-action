name: Test deprecated service-name input alias
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          languages: js
          api_key: test-api-key-12345
          service-name: my-deprecated-service

      - name: Assert DD_SERVICE is set from deprecated service-name input
        run: |
          echo "actual DD_SERVICE: $DD_SERVICE"
          if [ -z "$DD_SERVICE" ]; then
            echo "FAIL: DD_SERVICE is not set"
            exit 1
          fi
          if [ "$DD_SERVICE" != "my-deprecated-service" ]; then
            echo "FAIL: expected DD_SERVICE='my-deprecated-service', got '$DD_SERVICE'"
            exit 1
          fi
          echo "PASS: DD_SERVICE is set correctly from deprecated service-name input"

      - name: Assert DD_API_KEY is set
        run: |
          echo "actual DD_API_KEY: $DD_API_KEY"
          if [ "$DD_API_KEY" != "test-api-key-12345" ]; then
            echo "FAIL: expected DD_API_KEY='test-api-key-12345', got '$DD_API_KEY'"
            exit 1
          fi
          echo "PASS: DD_API_KEY is set correctly"

      - name: Assert DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER is set
        run: |
          echo "actual DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER: $DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER"
          if [ "$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER" != "github" ]; then
            echo "FAIL: expected DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER='github', got '$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER'"
            exit 1
          fi
          echo "PASS: DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER is set correctly"
