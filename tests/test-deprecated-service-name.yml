name: Test deprecated service-name input alias
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          languages: js
          api_key: fake-api-key-for-testing
          service-name: my-deprecated-service
        continue-on-error: true

      - name: Assert DD_SERVICE is set via deprecated service-name input
        run: |
          echo "DD_SERVICE: $DD_SERVICE"
          if [ "$DD_SERVICE" != "my-deprecated-service" ]; then
            echo "FAIL: expected DD_SERVICE=my-deprecated-service, got '$DD_SERVICE'"
            exit 1
          fi
          echo "PASS: DD_SERVICE=my-deprecated-service via deprecated service-name alias"

      - name: Assert DD_API_KEY is set
        run: |
          echo "DD_API_KEY: $DD_API_KEY"
          if [ -z "$DD_API_KEY" ]; then
            echo "FAIL: DD_API_KEY is not set"
            exit 1
          fi
          echo "PASS: DD_API_KEY is set"
