name: Test deprecated service-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: js
          api_key: fake-key-for-testing
          service-name: my-legacy-service
          cache: "false"
          print-github-step-summary: "false"
      - name: Assert action ran with deprecated service-name input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with deprecated service-name input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert DD_SERVICE env var was set from service-name
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DD_SERVICE_VAL: ${{ env.DD_SERVICE }}
        run: |
          echo "outcome: $OUTCOME"
          echo "DD_SERVICE: $DD_SERVICE_VAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$DD_SERVICE_VAL" = "my-legacy-service" ]; then
              echo "PASS: DD_SERVICE correctly set from service-name"
            else
              echo "FAIL: expected DD_SERVICE='my-legacy-service', got '$DD_SERVICE_VAL'"
              exit 1
            fi
          else
            echo "PASS: action failed gracefully (likely due to fake API key)"
          fi
