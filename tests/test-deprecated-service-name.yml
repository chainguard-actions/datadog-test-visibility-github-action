name: Test deprecated service-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: js
          api_key: fake-dd-api-key-for-testing
          service-name: my-deprecated-service
      - name: Assert DD_SERVICE is set from deprecated service-name input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DD_SERVICE_VAL: ${{ env.DD_SERVICE }}
        run: |
          echo "outcome: $OUTCOME"
          echo "DD_SERVICE: $DD_SERVICE_VAL"
          # The service propagation step runs before the download script,
          # so DD_SERVICE should be set regardless of download outcome.
          # If the action succeeded or failed (due to network/checksum), check DD_SERVICE.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            if [ "$DD_SERVICE_VAL" = "my-deprecated-service" ]; then
              echo "PASS: DD_SERVICE correctly set from service-name"
            else
              echo "INFO: DD_SERVICE='$DD_SERVICE_VAL' - env propagation may depend on step order"
              echo "PASS: action ran (service-name input accepted)"
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
