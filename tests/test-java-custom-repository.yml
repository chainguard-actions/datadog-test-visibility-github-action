name: Test java custom repository inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: java
          api_key: fake-api-key-for-input-coverage
          java-tracer-repository-url: https://repo.example.com/maven
          java-tracer-repository-auth-header: 'Authorization: Bearer test-token'
          java-tracer-auth-disable-redirects: 'true'
          cache: 'false'
      - name: Assert action ran (input coverage for java custom repository inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with java-tracer-repository-url, java-tracer-repository-auth-header, and java-tracer-auth-disable-redirects inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
