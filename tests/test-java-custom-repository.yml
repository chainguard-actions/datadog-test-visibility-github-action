name: Test Java custom tracer repository inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: java
          api_key: fake-dd-api-key-for-testing
          java-tracer-repository-url: https://repo.example.com/maven
          java-tracer-repository-auth-header: "Authorization: Bearer test-token"
          java-tracer-auth-disable-redirects: "true"
      - name: Assert action ran with java repository inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action accepts these inputs and passes them as env vars to the install script.
          # We verify the action ran (success or graceful failure due to network/checksum).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with java-tracer-repository-url, java-tracer-repository-auth-header, and java-tracer-auth-disable-redirects inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
