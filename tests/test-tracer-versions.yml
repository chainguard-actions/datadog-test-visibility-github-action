name: Test tracer version inputs and java-instrumented-build-system
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: java
          api_key: fake-api-key-for-testing
          dotnet-tracer-version: "2.49.0"
          java-tracer-version: "1.38.0"
          js-tracer-version: "5.18.0"
          python-tracer-version: "2.9.0"
          ruby-tracer-version: "1.3.0"
          go-tracer-version: "0.48.0"
          java-instrumented-build-system: gradle

      - name: Assert DD_API_KEY env var was set
        run: |
          echo "DD_API_KEY: $DD_API_KEY"
          if [ -z "$DD_API_KEY" ]; then
            echo "FAIL: DD_API_KEY was not set"
            exit 1
          fi
          echo "PASS: DD_API_KEY is set"

      - name: Assert DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER env var was set
        run: |
          echo "DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER: $DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER"
          if [ "$DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER" != "github" ]; then
            echo "FAIL: expected DD_CIVISIBILITY_AUTO_INSTRUMENTATION_PROVIDER=github"
            exit 1
          fi
          echo "PASS"
