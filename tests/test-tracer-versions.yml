name: Test tracer version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: js python
          api_key: fake-dd-api-key-for-testing
          site: datadoghq.com
          js-tracer-version: "5.0.0"
          python-tracer-version: "2.0.0"
          dotnet-tracer-version: "2.9.0"
          java-tracer-version: "1.30.0"
          ruby-tracer-version: "1.0.0"
      - name: Assert action ran (tracer version inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with tracer version inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - script download or checksum may fail in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
