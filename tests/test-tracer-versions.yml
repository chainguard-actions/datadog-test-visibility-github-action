name: Test tracer version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: js python
          api_key: fake-dd-api-key-for-testing
          site: datadoghq.com
          service-name: my-test-service
          js-tracer-version: "5.0.0"
          python-tracer-version: "2.0.0"
          python-coverage-version: "7.13.5"
          dotnet-tracer-version: "3.0.0"
          java-tracer-version: "1.0.0"
          ruby-tracer-version: "1.0.0"
          print-github-step-summary: "false"
      - name: Assert action ran (inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with tracer version inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
