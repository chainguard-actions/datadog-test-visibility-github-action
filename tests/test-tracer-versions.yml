name: Test tracer version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: js
          api_key: fake-api-key-for-testing
          site: datadoghq.com
          js-tracer-version: "5.0.0"
          python-tracer-version: "2.0.0"
          python-coverage-version: "7.13.5"
          ruby-tracer-version: "1.0.0"
          dotnet-tracer-version: "2.0.0"
      - name: Assert action ran with tracer version inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with tracer version inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert DD_CIVISIBILITY_INSTRUMENTATION_LANGUAGES was set
        run: |
          echo "DD_CIVISIBILITY_INSTRUMENTATION_LANGUAGES: $DD_CIVISIBILITY_INSTRUMENTATION_LANGUAGES"
          if [ -z "$DD_CIVISIBILITY_INSTRUMENTATION_LANGUAGES" ]; then
            echo "INFO: env var not set (action may have failed before setting it)"
          else
            echo "PASS: env var is set"
          fi
