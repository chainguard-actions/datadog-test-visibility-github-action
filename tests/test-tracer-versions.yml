name: Test tracer version inputs for JS, Python, Ruby, and dotnet
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          languages: js python ruby dotnet
          api_key: fake-api-key-for-testing
          js-tracer-version: "5.0.0"
          python-tracer-version: "2.0.0"
          python-coverage-version: "7.13.5"
          ruby-tracer-version: "1.0.0"
          dotnet-tracer-version: "2.0.0"
          print-github-step-summary: "false"
        continue-on-error: true
      - name: Assert action accepted tracer version inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action accepted js, python, ruby, and dotnet tracer version inputs"
